name: Dependabot AI PR Review & Approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Limit Workflow Concurrency so Dependabot PRs don't exhaust API Rate Limits simultaneously
concurrency:
  group: gemini-ai-review
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  review-and-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout Repository Context
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch Dependabot Metadata
        uses: dependabot/fetch-metadata@v2
        id: metadata
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate AI PR Review Comment via PRReviewerAgent
        uses: nick-fields/retry@v3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ vars.GEMINI_MODEL_NAME || 'gemini-3.6-flash' }}
          REPO_URL: ${{ github.event.repository.html_url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 65
          command: |
            python -m pip install google-genai
            python -c "
            import os, time
            from google import genai
            from google.genai.errors import ClientError

            client = genai.Client()
            model_name = os.getenv('GEMINI_MODEL_NAME', 'gemini-3.6-flash')
            
            repo_url = os.getenv('REPO_URL')
            pr_url = os.getenv('PR_URL')
            pr_title = os.getenv('PR_TITLE')
            pr_body = os.getenv('PR_BODY')

            prompt = f'''
            You are PRReviewerAgent.
            Github Repository: {repo_url}
            PR: {pr_url}
            PR Title: {pr_title}
            
            PR Body Details:
            {pr_body}

            Task:
            Evaluate if this PR is safe to merge based on SemVer changes, scope, and breaking changes.
            Generate PR Review Approval Content in Markdown format strictly matching this structure:

            ## PR Review: Safe to Merge ✅

            ### Summary
            [Brief summary of dependency bump and targeted directory]

            ---

            ### Analysis & Assessment

            | Check | Status | Details |
            | :--- | :---: | :--- |
            | **SemVer Impact** | 🟢 Safe | [Patch/Minor version details] |
            | **Breaking Changes** | 🟢 None | [Analysis of breaking changes] |
            | **Scope** | 🟢 Isolated | [Scope and manifest file details] |

            ---

            ### Recommendation
            **Safe to merge.** [Closing recommendation]
            '''

            chat = client.chats.create(model=model_name)
            response = chat.send_message(prompt)

            with open('review_comment.md', 'w', encoding='utf-8') as f:
                f.write(response.text)
            "

      - name: Submit AI Review Comment & Approve PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "$PR_URL" --approve --body-file review_comment.md